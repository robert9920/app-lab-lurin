[tool.ruff]
target-version = "py312"
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint.isort]
known-first-party = ["blueprints", "config", "database", "errors", "http_helpers", "security", "services", "validation", "function_app", "test_workflow"]
